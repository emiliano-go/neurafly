name: Publish to AUR

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System audio deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Verify release consistency
        run: cargo test --test release -- --prerelease
      - name: Verify AUR source checksum matches the tag tarball
        run: |
          set -euo pipefail
          version="$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)"
          expected="$(sed -n "s/^sha256sums=('\([0-9a-f]*\)')/\1/p" packaging/aur/PKGBUILD)"
          url="https://github.com/emiliano-go/neurafly/archive/refs/tags/v${version}.tar.gz"
          echo "tarball:  $url"
          echo "expected: $expected"
          curl -fsSL "$url" -o /tmp/neurafly-src.tar.gz
          actual="$(sha256sum /tmp/neurafly-src.tar.gz | cut -d' ' -f1)"
          echo "actual:   $actual"
          [ "$actual" = "$expected" ]
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: neurafly
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: Emiliano Gandini Outeda
          commit_email: emiliano.gandini@protonmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
