[package]
name = "neurafly"
version = "0.2.0"
edition = "2021"
description = "Real audio in, real neurons firing, real time. A terminal audio visualizer driven by a FlyWire connectome."
license = "MIT"
repository = "https://github.com/emiliano-go/neurafly"
readme = "README.md"
keywords = ["audio", "visualizer", "terminal", "tui", "connectome"]
categories = ["command-line-utilities", "multimedia::audio"]
# keep the published crate under crates.io's 10 MB limit; the 18 MB connectome
# ships with the repo/release, not the crate (binary falls back to a synthetic net)
exclude = ["data/flywire_net.bin", "assets", "packaging"]

[dependencies]
crossterm = "0.28"
rustfft = "6"
cpal = "0.16"
symphonia = { version = "0.5", features = ["mp3", "ogg", "flac", "wav"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
